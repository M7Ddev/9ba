<!doctype html>
<!--
  Default language is Arabic (RTL). The <html lang> and <html dir> attributes are
  updated at runtime by App.jsx when the user toggles the language.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صَبّة</title>

    <!-- Declaring an icon stops the browser probing /favicon.ico and 404ing. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#6F4E37" />

    <!-- Modern Arabic web font (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Apply the stored theme before the first paint, otherwise a dark-mode user
      sees a flash of the cream background while React boots. Must stay in sync
      with src/lib/theme.js — same storage key, same rule.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('brewmaster.theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* Storage blocked: the CSS media query still handles it. */
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
