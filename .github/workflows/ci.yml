name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are needed: Gemini is faked in every test, so the suite runs
# offline. Nothing here should ever require a real API key.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — tests, style, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Laravel 13 pulls Symfony v8, which requires >= 8.4.1. Keep this in
          # step with the `php` constraint in backend/composer.json.
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: ./vendor/bin/pint --test app config routes tests

      - name: Run test suite
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit

  frontend:
    name: Frontend — build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit JS dependencies
        run: npm audit --audit-level=high

      - name: Assert no API key in the built bundle
        run: |
          if grep -rqE 'AIza[0-9A-Za-z_-]{20,}' ../backend/public/app/; then
            echo "::error::A Google API key pattern was found in the built bundle."
            exit 1
          fi
          echo "No key material in the build."

      - name: Assert no development URL in the built bundle
        run: |
          # The production build is served same-origin by Laravel, so every API
          # call must be relative. A localhost URL here means VITE_API_BASE_URL
          # leaked in from `.env` (which Vite loads in every mode) and the
          # deployed site would call the visitor's own machine.
          if grep -rqE 'https?://localhost' ../backend/public/app/; then
            echo "::error::A localhost URL was compiled into the production bundle."
            grep -roE 'https?://localhost[:0-9]*' ../backend/public/app/ | head
            exit 1
          fi
          echo "No development URL in the build."

  docker:
    name: Docker — build and boot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sabba:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; running proves it actually serves. The
      # entrypoint migrates, caches config and starts FrankenPHP, so a failure
      # in any of that shows up here rather than on the host.
      - name: Boot the container and check it serves
        run: |
          # Reproduce how a managed host runs the image, not how Docker runs it
          # by default.
          #
          # no-new-privileges is the restriction that matters: without it the
          # image passed CI and then died on Render with
          # "exec: frankenphp: Operation not permitted" (exit 126), because the
          # FrankenPHP binary carried a Linux file capability and hardened
          # runtimes refuse to exec such files.
          #
          # Capabilities are deliberately NOT dropped wholesale. --cap-drop=ALL
          # is stricter than Render actually is, and a test that fails on
          # conditions the host never imposes is noise — it trains you to ignore
          # a red job.
          #
          # PORT is set for the same reason: managed hosts assign one and route
          # only there, so the default would not exercise the real path.
          docker run -d --name sabba -p 8080:9123 \
            --security-opt no-new-privileges \
            -e PORT=9123 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            sabba:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json 2>/dev/null; then
              echo "Health: $(cat /tmp/health.json)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Container did not become healthy in time."
              docker logs sabba
              exit 1
            fi
            sleep 2
          done

          # The SPA must be served by Laravel on the same origin.
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://localhost:8080/)
          if [ "$code" != "200" ]; then
            echo "::error::The app shell returned HTTP $code"
            docker logs sabba
            exit 1
          fi
          grep -q 'id="root"' /tmp/index.html \
            || { echo "::error::The served page is not the built SPA."; exit 1; }

          echo "Image builds, boots, migrates and serves both the API and the SPA."

      - name: Container logs
        if: always()
        run: docker logs sabba || true

  security:
    name: Security — secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: No real .env committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.' | grep -v '\.example$'; then
            echo "::error::A real .env file is tracked in git."
            exit 1
          fi
          echo "Only .example templates are tracked."

      - name: No secrets in tracked files
        run: |
          # AIzaSyFAKE... is the deliberate placeholder in the security test suite.
          hits=$(git grep -nIE 'AIza[0-9A-Za-z_-]{20,}' -- . \
                 | grep -v 'AIzaSyFAKE' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible API key in tracked files:"
            echo "$hits"
            exit 1
          fi
          echo "No key material in tracked files."

      - name: Env templates carry no values
        run: |
          bad=$(grep -hE '^(APP_KEY|GEMINI_API_KEY|DB_PASSWORD)=.+' \
                backend/.env.example backend/.env.production.example 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::An env template contains a value:"
            echo "$bad"
            exit 1
          fi
          echo "Templates are empty."
